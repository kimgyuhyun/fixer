packages:
  - 'apps/*'
  - 'packages/*'

# create-next-app이 apps/web에 만들던 설정을 루트로 올린 것.
# pnpm은 워크스페이스 루트의 이 파일만 읽으므로 하위 패키지에 두면 무시된다.
allowBuilds:
  # Prisma는 postinstall에서 쿼리 엔진 바이너리를 내려받는다. 막으면 DB 접속이 안 된다.
  '@prisma/engines': true
  prisma: true
  # Vitest가 쓰는 네이티브 바이너리. 막으면 테스트가 아예 안 돈다.
  esbuild: true
  # Testcontainers가 Docker 데몬과 통신할 때 쓴다.
  ssh2: true
  protobufjs: true
  sharp: false
  # ssh2의 선택적 네이티브 가속. 없어도 순수 JS로 동작하므로 빌드 툴체인을 요구하지 않는다.
  cpu-features: false
  unrs-resolver: false
  # bcrypt는 prebuilds/ 에 플랫폼별 바이너리를 담아 배포한다. install 스크립트는
  # node-pre-gyp로 그걸 다시 내려받는 것이라 없어도 require가 그대로 된다.
  bcrypt: false

# docs/result/security-exceptions.md "수용 중인 예외"에 ⚪로 기록한 권고만 audit에서 뺀다.
# 수용한 것까지 빨갛게 뜨면 CI audit 잡이 늘 빨간 X가 되고, 새 취약점이 섞여도 눈에 띄지 않는다.
# 대장에 없는 ID는 넣지 않는다. 해소되거나 재판정으로 수용을 거두면 대장과 함께 여기서도 뺀다.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <= 3.0.3 — 대장 1번, 재검토 2027-01-19
